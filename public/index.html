<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="Mapa de rutas del Sendero Los Matapalos.">
  <title>Sendero Los Matapalos</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      padding: 76px 16px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f5f5f2;
      font-family: Arial, Helvetica, sans-serif;
    }
    .download {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #f58220;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.16);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .download:hover { background: #df6e12; transform: translateY(-1px); }
    .download svg { width: 18px; height: 18px; }
    main { width: min(100%, 1500px); }
    .map {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    @media (max-width: 600px) {
      body { padding: 68px 8px 12px; }
      .download { top: 12px; right: 12px; padding: 10px 13px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <a class="download" href="/sendero_los_matapalos.png"
     download="mapa_sendero_los_matapalos.png" aria-label="Descargar mapa">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 17v3h16v-3"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round"/>
    </svg>
    Descargar mapa
  </a>
  <main>
    <img class="map" src="/sendero_los_matapalos.png"
         alt="Mapa de las rutas larga y corta del Sendero Los Matapalos">
  </main>
</body>
</html>
